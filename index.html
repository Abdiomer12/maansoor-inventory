<script>
        // --- 1. CONFIGURATION & DATABASE CONNECTION ---
        const supabaseUrl = 'https://caianuiwgprgxyjevyqy.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhaWFudWl3Z3ByZ3h5amV2eXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5MzAwMDEsImV4cCI6MjA4MjUwNjAwMX0.AVqzFT7s1YeEJOX6EWVNl-SamDqfsfEr3HDVGyDiVBE';
        const db = supabase.createClient(supabaseUrl, supabaseKey);

        let profile = JSON.parse(localStorage.getItem('maansoor_profile')) || {
            user: "admin",
            pass: "123",
            fullName: "Admin Maansoor",
            email: "admin@maansoorhotel.com",
            phone: "+252 634245995"
        };

        let inventory = [];
        let activityLogs = [];
        let currentSelectedLocation = ""; 
        let currentCategory = "room"; 
        let editId = null; 
        let myChart1, myChart2;
        let currentImageBase64 = null; 

        // --- 2. AUTHENTICATION LOGIC ---
        async function checkAuth() {
            const auth = localStorage.getItem('maansoor_isLoggedIn');
            const loginTime = localStorage.getItem('maansoor_loginTime');
            const oneHour = 3600000;

            if(auth === 'true') {
                if (loginTime && (Date.now() - parseInt(loginTime) > oneHour)) {
                    handleLogout();
                    return;
                }
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-content').classList.remove('hidden');
                
                await loadInventory(); 
                await loadLogs();
                setupRealtime(); // Daar is-waafajinta tooska ah
                showHomePage();

                const savedProfile = JSON.parse(localStorage.getItem('maansoor_profile')) || { user: "Admin" };
                document.getElementById('header-username').innerText = savedProfile.user;
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('app-content').classList.add('hidden');
            }
        }

        function handleLogin() {
            const uInput = document.getElementById('username').value.trim();
            const pInput = document.getElementById('password').value.trim();
            if(uInput === profile.user && pInput === profile.pass) {
                localStorage.setItem('maansoor_isLoggedIn', 'true');
                localStorage.setItem('maansoor_loginTime', Date.now().toString()); 
                addLog("Login", `User-ka ${uInput} ayaa soo galay.`); 
                checkAuth();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        async function handleLogout() {
            localStorage.removeItem('maansoor_isLoggedIn');
            localStorage.removeItem('maansoor_loginTime');
            window.location.reload();
        }

        function setupRealtime() {
            db.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'inventory' }, () => loadInventory()).subscribe();
            db.channel('logs').on('postgres_changes', { event: '*', schema: 'public', table: 'logs' }, () => loadLogs()).subscribe();
        }

        // --- 3. DATA LOADING ---
        async function loadInventory() {
            const { data, error } = await db.from('inventory').select('*').order('id', { ascending: false });
            if (!error) {
                inventory = data;
                renderTable(currentSelectedLocation);
                updateDashboardStats();
                updateCharts();
                updateBadges();
            }
        }

        async function loadLogs() {
            const { data, error } = await db.from('logs').select('*').order('id', { ascending: false }).limit(100);
            if (!error) {
                activityLogs = data;
                renderLogsTable();
            }
        }

        // --- 4. CORE FUNCTIONS ---
        async function addLog(action, details, backupData = null) {
            const logEntry = {
                user: profile.user || "admin",
                action: action,
                details: details,
                timestamp: new Date().toLocaleString('en-GB'),
                backup: backupData ? JSON.parse(JSON.stringify(backupData)) : null
            };
            await db.from('logs').insert([logEntry]);
        }

        function showHomePage() {
            currentSelectedLocation = ""; 
            currentCategory = "";
            hideAllScreens(); 
            document.getElementById('dashboard-content').classList.remove('hidden');
            document.getElementById('dashboard-visuals').classList.remove('hidden');
            document.getElementById('selection-area').classList.add('hidden');
            document.getElementById('table-title').innerText = "FULL HOTEL INVENTORY LOG"; 
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('btn-active'));
            renderTable("");
        }

        function renderTable(loc = "") {
            const tbody = document.getElementById('inventory-tbody'); 
            if(!tbody) return;
            tbody.innerHTML = ''; 
            
            let filtered = (loc === "" || ["Room","Hall","Kitchen","Office"].includes(loc)) 
                           ? inventory.filter(i => i.location && i.location.startsWith(loc)) 
                           : inventory.filter(i => i.location === loc);
            
            filtered.forEach((i, index) => {
                const statusColor = i.status === 'Damaged' ? 'text-red-600 bg-red-50' : i.status === 'Missing' ? 'text-amber-600 bg-amber-50' : 'text-green-600 bg-green-50';
                let imageIcon = i.image ? `<button onclick="viewImage('${i.image}', '${i.name}')" class="ml-2 text-blue-500"><i class="fas fa-camera"></i></button>` : '';

                tbody.innerHTML += `<tr class="hover:bg-yellow-50/50 border-b">
                    <td class="px-6 py-4 text-[11px] font-bold text-gray-400">${index + 1}.</td>
                    <td class="px-6 py-4 text-xs font-mono">${i.code || '-'}</td>
                    <td class="px-6 py-4 text-xs font-bold text-slate-700">
                        <div class="flex items-center">${i.name} ${imageIcon}</div>
                        <span class="text-[9px] text-yellow-600 uppercase font-black">${i.location}</span>
                    </td>
                    <td class="px-6 py-4 text-xs">
                        <span class="px-2 py-1 rounded-full text-[10px] font-bold ${statusColor}">${i.status || 'Good'}</span>
                    </td>
                    <td class="px-6 py-4 text-xs font-bold text-slate-700">${i.qty}</td>
                    <td class="px-6 py-4 text-xs font-extrabold text-slate-900">${i.total}</td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="editItem(${i.id})" class="text-blue-500 mr-2"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteItem(${i.id})" class="text-red-400"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            });
        }

        async function saveData() {
            const n = document.getElementById('name').value;
            const q = document.getElementById('qty').value;
            if(!n || !q) return Swal.fire('Cillad!', 'Buuxi Magaca iyo Tirada!', 'error');

            Swal.showLoading();
            const data = {
                id: editId || Date.now(),
                holder: document.getElementById('holder').value || '',
                dept: document.getElementById('dept').value || '',
                location: document.getElementById('location').value || '',
                code: document.getElementById('code').value || '',
                name: n,
                status: document.getElementById('status').value,
                qty: parseFloat(q),
                uvalue: parseFloat(document.getElementById('uvalue').value) || 0,
                total: document.getElementById('total').value || '$0.00',
                image: currentImageBase64 || null,
                desc: document.getElementById('desc').value || ''
            };

            let result = editId ? await db.from('inventory').update(data).eq('id', editId) : await db.from('inventory').insert([data]);
            
            if (!result.error) {
                Swal.fire({ title: 'Waa la kaydiyey!', icon: 'success', timer: 1500, showConfirmButton: false });
                addLog(editId ? "Cusboonaysiiyey" : "Ku daray", `Agab: ${n} ee yaalay ${data.location}`);
                resetForm();
                loadInventory();
            } else {
                Swal.fire('Cillad!', 'Xogta ma fariisan.', 'error');
            }
        }

        // --- 5. UI UTILITIES ---
        function calculate() { 
            const q = parseFloat(document.getElementById('qty').value) || 0; 
            const v = parseFloat(document.getElementById('uvalue').value) || 0; 
            document.getElementById('total').value = `$${(q * v).toFixed(2)}`; 
        }

        function hideAllScreens() {
            ['dashboard-content', 'settings-screen', 'logs-screen', 'entry-form', 'selection-area'].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.classList.add('hidden');
            });
        }

        function resetForm() {
            editId = null; currentImageBase64 = null;
            const fields = ['holder','dept','location','code','name','desc','qty','uvalue','total'];
            fields.forEach(f => { if(document.getElementById(f)) document.getElementById(f).value = ''; });
            document.getElementById('status').value = 'Good';
            document.getElementById('image-preview-container').classList.add('hidden');
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }

        // --- DASHBOARD & CHARTS ---
        function updateDashboardStats() {
            const totalItems = inventory.length;
            const totalValue = inventory.reduce((sum, item) => sum + (parseFloat(item.total?.replace(/[$,]/g, '')) || 0), 0);
            document.getElementById('stat-total-items').innerText = `${totalItems} Items`;
            document.getElementById('stat-total-value').innerText = `$${totalValue.toLocaleString()}`;
        }

        function updateCharts() {
            const cats = ['Room', 'Hall', 'Kitchen', 'Office'];
            const values = cats.map(c => inventory.filter(i => i.location?.includes(c)).reduce((sum, i) => sum + (parseFloat(i.total?.replace(/[$,]/g, '')) || 0), 0));
            const counts = cats.map(c => inventory.filter(i => i.location?.includes(c)).length);

            if(myChart1) myChart1.destroy();
            if(myChart2) myChart2.destroy();

            const ctx1 = document.getElementById('categoryChart')?.getContext('2d');
            if(ctx1) myChart1 = new Chart(ctx1, { type: 'bar', data: { labels: cats, datasets: [{ data: values, backgroundColor: ['#0D47A1', '#1B5E20', '#B71C1C', '#B45309'] }] }, options: { responsive: true, maintainAspectRatio: false } });

            const ctx2 = document.getElementById('countChart')?.getContext('2d');
            if(ctx2) myChart2 = new Chart(ctx2, { type: 'doughnut', data: { labels: cats, datasets: [{ data: counts, backgroundColor: ['#0D47A1', '#1B5E20', '#B71C1C', '#B45309'] }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } } });
        }

        function changeCategory(cat, count) {
            currentCategory = cat; currentSelectedLocation = "";
            const catLabel = cat.charAt(0).toUpperCase() + cat.slice(1);
            hideAllScreens();
            document.getElementById('dashboard-content').classList.remove('hidden');
            document.getElementById('selection-area').classList.remove('hidden');
            const grid = document.getElementById('grid-buttons'); grid.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                const btn = document.createElement('button');
                btn.innerText = i; btn.className = "room-btn p-2.5 bg-white border rounded-xl text-xs font-bold";
                btn.onclick = (e) => {
                    currentSelectedLocation = `${catLabel} ${i}`;
                    document.getElementById('location').value = currentSelectedLocation;
                    document.getElementById('entry-form').classList.remove('hidden');
                    renderTable(currentSelectedLocation);
                };
                grid.appendChild(btn);
            }
            renderTable(catLabel);
        }

        function updateBadges() {
            ['Room', 'Hall', 'Kitchen', 'Office'].forEach(cat => {
                const count = inventory.filter(i => i.location?.includes(cat)).length;
                const el = document.getElementById(`badge-${cat.toLowerCase()}`);
                if(el) el.innerText = count;
            });
        }
        
        // --- ADD MISSING UI FUNCTIONS ---
        function showLogs() { hideAllScreens(); document.getElementById('logs-screen').classList.remove('hidden'); loadLogs(); }
        function showSettings() { hideAllScreens(); document.getElementById('settings-screen').classList.remove('hidden'); }
        function filterInventory() { 
            const q = document.getElementById('searchInput').value.toLowerCase();
            if(!q) { renderTable(currentSelectedLocation); return; }
            const filtered = inventory.filter(i => i.name?.toLowerCase().includes(q) || i.code?.toLowerCase().includes(q) || i.location?.toLowerCase().includes(q));
            inventory = filtered; renderTable(""); loadInventory(); // Reset list after search
        }
        
        async function deleteItem(id) {
            const i = inventory.find(x => x.id === id);
            Swal.fire({ title: 'Ma hubtaa?', text: `Tirtir: ${i.name}?`, icon: 'warning', showCancelButton: true, confirmButtonText: 'Haa' }).then(async (r) => {
                if(r.isConfirmed) {
                    const { error } = await db.from('inventory').delete().eq('id', id);
                    if(!error) { addLog("Tirtiray", `Agabka: ${i.name}`, i); loadInventory(); }
                }
            });
        }

        // Camera helper
        function openCamera() {
            const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (ev) => {
                    currentImageBase64 = ev.target.result;
                    document.getElementById('image-preview').src = currentImageBase64;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

    </script>
</body>
</html>
